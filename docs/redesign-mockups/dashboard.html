  <template id="page">

        <h1>Home</h1>

      </div>

    <div id="phoneDeck" class="phone-deck" hidden>

    <div id="homeLong">

          </div>
          <div class="vtank lsmgo">
            <div class="vtank-glass" style="--fill:57.5%; --open:80%"><i></i><s></s></div>

    <div class="board-top">

          <div class="metric"><b>938 nm</b><span>nm to go</span></div>

      <div>
        <section class="band" id="latest-noon">

          </div>

          </div>

          <div class="btn-row">
            <a class="btn small" href="vessel.html">Vessel Setup</a>

      <div class="btn-row"><a class="btn small" href="rob.html">ROB</a></div>
      <h3 class="nav-k">Fuel</h3>
      <div class="gauges">
        <div class="gauge">
          <div class="name">VLSFO</div>

          <div class="bar"><i style="width:83%"></i><s style="left:100%"></s></div>
          <div class="meta">start 980.000 MT · used 167.750 MT · corr +0.200 · survey 812.450 MT</div>
        </div>
        <div class="gauge">
          <div class="name">LSMGO</div>
          <div class="now">86.200 MT</div>
          <div class="bar mdo"><i style="width:72%"></i><s style="left:100%"></s></div>

        </div>

    <section class="band" id="performance">
      <h2>Performance averages</h2>
      <div class="btn-row">
        <button type="button" class="btn small primary">Recalculate averages</button>
        <button type="button" class="btn small">Undo recalculate</button>
      </div>
      <div class="stat-row" style="margin-top:8px">
        <div class="stat"><b>74.80</b><span>RPM</span></div>
        <div class="stat"><b>3.60%</b><span>Slip</span></div>
        <div class="stat"><b>6,920 kW</b><span>Load (kW)</span></div>
        <div class="stat"><b>72.80%</b><span>Load (% MCR)</span></div>
        <div class="stat"><b>305.40 nm</b><span>Engine distance</span></div>
        <div class="stat"><b>12.70 kn</b><span>Engine speed</span></div>
        <div class="stat"><b>297.10 nm</b><span>Ship distance</span></div>
        <div class="stat"><b>12.38 kn</b><span>Ship speed</span></div>
      </div>
      <p class="hint">If these still look like an older voyage, recalculate. Undo puts the previous figures back.</p>
    </section>

    <section class="band" id="sfoc">
      <h2>Fuel efficiency (SFOC)</h2>
      <div class="stat-row">
        <div class="stat"><b>171.50</b><span>SFOC @ 100% MCR (setup) · g/kWh</span></div>
        <div class="stat"><b>174.20</b><span>Ref. @ 72.80% MCR · g/kWh</span></div>
        <div class="stat"><b>176.80</b><span>Actual SFOC ISO · g/kWh</span></div>
        <div class="stat"><b>+1.49%</b><span>Δ vs reference</span></div>
        <div class="stat"><b>72.80%</b><span>Avg (hrs-wtd) · % MCR</span></div>
      </div>
      <p class="hint">SFOC(L) = SFOC₁₀₀ × (a + b × (L/100)²). Estimated kW is the propeller law, (RPM / MCR RPM)³ × MCR kW. ISO correction uses shop-trial LCV / bunker LCV. A sustained +3% is the investigation line; this voyage is inside it.</p>
    </section>

    <section class="band" id="hours">
      <h2>Machinery running hours (voyage)</h2>
      <div class="stat-row">
        <div class="stat"><b>98.4 h</b><span>M/E steaming</span></div>

        <div class="stat"><b>86.5 h</b><span>A/E #2</span></div>
        <div class="stat"><b>—</b><span>A/E #3</span></div>

      </div>

    </section>

    <section class="band" id="bdn">
      <h2>BDN and sample retention</h2>
      <p class="sub">MARPOL Annex VI Reg. 18. BDN kept 3 years. Sealed sample kept 12 months. Lube and fresh water are not listed.</p>
      <div class="btn-row">
        <button type="button" class="btn small">Refresh</button>
        <button type="button" class="btn small">Print retention list</button>
      </div>
      <div class="scroll-x" style="margin-top:8px">

          <thead><tr><th class="left">Delivered</th><th class="left">BDN no.</th><th class="left">Grade</th><th>Qty</th><th class="left">Port</th><th class="left">Sample until</th><th class="left">BDN until</th></tr></thead>

          </tbody>
        </table>
      </div>

    <section class="band" id="pms">
      <h2>Running hours and maintenance</h2>
      <p class="sub">The counter on the machine is the authority. Voyage hours above are this leg; these are the unit’s life.</p>

        <button type="button" class="btn small">Add unit</button>
        <button type="button" class="btn small">Offer hours since last reading</button>

  <script>
    document.getElementById('rearrange') && document.getElementById('rearrange').addEventListener('click', function () {
      var hint = document.getElementById('rearrange-hint');
      if (hint) hint.hidden = !hint.hidden;
      this.classList.toggle('on');
    });

    (function () {
      var mq = window.matchMedia('(max-width: 599px), (orientation: landscape) and (max-height: 500px)');
      var groups = {
        voyage: ['passage'],
        fuel: ['fuel-gauges', 'rob'],
        tanks: ['tanks']
      };
      var moved = [];
      var deck, long, snap;
      function take(id, pane) {
        var el = document.getElementById(id);
        if (!el || !pane) return;
        var mark = document.createComment('slot');
        el.parentNode.insertBefore(mark, el);
        moved.push({ el: el, mark: mark });
        pane.appendChild(el);
      }
      function mark(idx) {
        deck.querySelectorAll('[data-goto]').forEach(function (b, n) {
          b.classList.toggle('on', n === idx);
        });
        deck.querySelectorAll('.dash-dots i').forEach(function (d, n) {
          d.classList.toggle('on', n === idx);
        });
      }
      function mount() {
        document.body.classList.add('phone-dash');
        deck.hidden = false;
        moved = [];
        Object.keys(groups).forEach(function (name) {
          var pane = snap.querySelector('[data-pane="' + name + '"]');
          groups[name].forEach(function (id) { take(id, pane); });
        });
        var rest = snap.querySelector('[data-pane="rest"]');
        while (long.firstElementChild) {
          var child = long.firstElementChild;
          var slot = document.createComment('slot');
          long.insertBefore(slot, child);
          moved.push({ el: child, mark: slot });
          rest.appendChild(child);
        }
        long.hidden = true;
        var names = ['voyage', 'fuel', 'tanks', 'rest'];
        var want = new URLSearchParams(location.search).get('pane') || 'voyage';
        var idx = names.indexOf(want);
        if (idx < 0) idx = 0;
        mark(idx);
        var jump = function () { snap.scrollLeft = idx * (snap.clientWidth || 1); mark(idx); };
        jump();
        requestAnimationFrame(jump);
      }
      function unmount() {
        document.body.classList.remove('phone-dash');
        deck.hidden = true;
        long.hidden = false;
        for (var i = moved.length - 1; i >= 0; i--) {
          var m = moved[i];
          if (m.mark && m.mark.parentNode) {
            m.mark.parentNode.insertBefore(m.el, m.mark);
            m.mark.remove();
          }
        }
        moved = [];
      }
      function indexNow() {
        var w = snap.clientWidth || 1;
        return Math.max(0, Math.min(3, Math.round(snap.scrollLeft / w)));
      }
      function wire() {
        deck.querySelectorAll('[data-goto]').forEach(function (b) {
          b.addEventListener('click', function () {
            var i = Number(b.getAttribute('data-goto'));
            var pane = snap.children[i];
            if (pane && pane.scrollIntoView) pane.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
            mark(i);
          });
        });
        snap.addEventListener('scroll', function () { mark(indexNow()); });
      }
      function apply() {
        if (mq.matches) mount();
        else if (document.body.classList.contains('phone-dash')) unmount();
      }
      function start() {
        deck = document.getElementById('phoneDeck');
        long = document.getElementById('homeLong');
        snap = document.getElementById('dashSnap');
        if (!deck || !long || !snap || deck.dataset.wired === '1') return;
        deck.dataset.wired = '1';
        wire();
        if (mq.addEventListener) mq.addEventListener('change', apply);
        apply();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
