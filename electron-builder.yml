appId: marine.chengpro.app
productName: ChEng AIO
copyright: ts0gs (Marvin C. Endozo)

directories:
  output: dist
  buildResources: desktop/build

files:
  - package.json
  - desktop/**/*
  - server/**/*
  - apps/**/*
  - modules/**/*
  - scripts/**/*
  - seed/**/*
  - "!**/*.map"
  - "!**/__pycache__/**"
  - "!modules/tanks/node_modules/**"
  - "!**/dist/**"

asarUnpack:
  - modules/tanks/scripts/**/*
  - modules/voyage/sync-server/**/*
  - scripts/**/*

extraResources:
  - from: desktop/runtime
    to: runtime
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ChEngAIO-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChEng AIO
  uninstallDisplayName: ChEng AIO

portable:
  artifactName: ChEngAIO-Portable-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ChEngAIO-${version}.${ext}
