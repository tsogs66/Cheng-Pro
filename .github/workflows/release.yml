name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:prepare
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.yml' -o -name '*.yaml' \) -print -exec cp -v {} release/ \;
          ls -la release || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: false
          body: |
            ## Cheng-Pro ${{ github.ref_name }}

            All-in-one marine chief engineer suite: **Voyage Chief** + **Tank Chief**.

            ### Install
            - **Windows**: run the NSIS installer, or use the portable EXE from USB
            - **Android**: install the APK (may need “unknown sources”)
            - **Server (Proxmox/Debian)**: see `deploy/proxmox-install.sh`

            ### Run from source
            ```bash
            npm install && npm run seed
            SYNC_ADMIN_PASSWORD='…' SYNC_API_TOKEN='…' npm start
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
