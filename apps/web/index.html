<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1420">
  <meta name="author" content="Marvin C. Endozo (ts0gs)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>ChEng AIO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- No Google Fonts — offline first launch must not block on network CSS. -->
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    /* Apply before first paint (same as Voyage Chief). */
    try {
      if (localStorage.getItem('marine_bright') === '1' || localStorage.getItem('vm_bright') === '1') {
        document.documentElement.classList.add('bright');
      }
    } catch (_e) {}
    /* Keep phone/tablet browsers on the mobile layout (block “Desktop site”). */
    (function lockMobileViewport() {
      const WANT = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function apply() {
        let meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        if (meta.getAttribute('content') !== WANT) meta.setAttribute('content', WANT);
      }
      apply();
      try {
        const mo = new MutationObserver(apply);
        mo.observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['content', 'name'] });
      } catch (_e) {}
      setInterval(apply, 1500);
    })();
  </script>
  <style>
    html, body { margin: 0; background: #0a1420; color: #e9e4d6; font-family: Georgia, "Times New Roman", serif; }
    html.bright, html.bright body { background: #efebe3; color: #122238; }
    #main:empty::before {
      content: "Starting ChEng AIO…";
      display: block;
      padding: 2rem 1.25rem;
      color: #a9a292;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="brand" id="brandHome" role="button" tabindex="0" title="Back to Home" aria-label="Back to Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>ChEng AIO</strong>
          <span>Chief Engineer All-In-One</span>
          <div class="brand-byline" id="appByline">ts0gs · Marvin C. Endozo</div>
        </div>
      </div>
      <div class="vessel-switcher" id="vesselSwitcher">
        <label for="activeVessel">Active vessel</label>
        <select id="activeVessel" aria-label="Active vessel"></select>
      </div>
      <div class="topbar-meta" id="topbarMeta">
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>
        <span class="app-version" id="appVersion" title="Build version"></span>
        <span id="healthDot" class="health-dot" title="Server"></span>
      </div>
    </header>
    <button type="button" class="theme-toggle theme-fab" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>

    <div class="body">
      <aside class="sidebar" id="sidebar">
        <nav class="nav" id="mainNav">
          <button type="button" class="nav-item active" data-module="home">Home</button>
          <button type="button" class="nav-item" data-module="voyage">Voyage</button>
          <button type="button" class="nav-item" data-module="tanks">Tanks</button>
          <button type="button" class="nav-item" data-module="eorb">e-ORB</button>
          <button type="button" class="nav-item" data-module="performance">Performance</button>
          <button type="button" class="nav-item" data-module="vessel">Vessel Setup</button>
          <button type="button" class="nav-item" data-module="backup">Backup</button>
          <button type="button" class="nav-item" data-module="license">License</button>
          <button type="button" class="nav-item" data-module="about">About</button>
        </nav>
        <p class="sidebar-note">On phone, the bottom bar opens Home / Voyage / Tanks / e-ORB / Perf. Backup, Vessel Setup, License, and About stay in this menu.</p>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary modules">
      <button type="button" class="bottom-item active" data-module="home">Home</button>
      <button type="button" class="bottom-item" data-module="voyage">Voyage</button>
      <button type="button" class="bottom-item" data-module="tanks">Tanks</button>
      <button type="button" class="bottom-item" data-module="eorb">e-ORB</button>
      <button type="button" class="bottom-item" data-module="performance">Perf</button>
    </nav>
    <button type="button" class="aio-home-fab" id="aioHomeFab" hidden title="Back to ChEng AIO Home" aria-label="Back to ChEng AIO Home">AIO</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/theme.js"></script>
  <script src="/js/print-bridge.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/bridge.js"></script>
  <script src="/js/license-config.js"></script>
  <script src="/js/license.js"></script>
  <script src="/js/voyage-bridge.js"></script>
  <script src="/js/flag-registry.js"></script>
  <script src="/js/perf-calc.js"></script>
  <script src="/js/modules/home.js"></script>
  <script src="/js/modules/vessel.js"></script>
  <script src="/js/modules/backup.js"></script>
  <script src="/js/modules/performance.js"></script>
  <script src="/js/modules/voyage.js"></script>
  <script src="/js/modules/eorb.js"></script>
  <script src="/js/modules/license.js"></script>
  <script src="/js/modules/about.js"></script>
  <script src="/js/shell.js"></script>
</body>
</html>
