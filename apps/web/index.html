<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1420">
  <meta name="author" content="Marvin C. Endozo (ts0gs)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>ChEng AIO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- No Google Fonts — offline first launch must not block on network CSS. -->
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/hud-effects.css">
  <script defer src="/js/num-align.js"></script>
  <script defer src="/js/count-up.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    /* Apply before first paint (same as Voyage Chief). */
    try {
      var tm = localStorage.getItem('marine_theme');
      var mode = 'night';
      if (tm === 'bright' || tm === 'prism' || tm === 'sailor' || tm === 'astrolabe' || tm === 'night') {
        mode = (tm === 'sailor') ? 'prism' : tm;
      }
      else if (localStorage.getItem('marine_bright') === '1' || localStorage.getItem('vm_bright') === '1') mode = 'bright';
      if (mode === 'bright') document.documentElement.classList.add('bright');
      if (mode === 'prism') document.documentElement.classList.add('prism');
      if (mode === 'astrolabe') document.documentElement.classList.add('astrolabe');
      document.documentElement.setAttribute('data-theme', mode);
    } catch (_e) {}
    /* Android shell: full-width home + floating nav (set early when possible). */
    try {
      var ua = navigator.userAgent || '';
      var cap = window.Capacitor;
      var plat = (cap && cap.getPlatform) ? String(cap.getPlatform()) : '';
      if (/Android/i.test(ua) || plat === 'android') {
        document.documentElement.classList.add('aio-android-nav');
      }
    } catch (_e) {}
    /* Keep phone/tablet browsers on the mobile layout (block “Desktop site”). */
    (function lockMobileViewport() {
      const WANT = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function apply() {
        let meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.appendChild(meta);
        }
        if (meta.getAttribute('content') !== WANT) meta.setAttribute('content', WANT);
      }
      apply();
      try {
        const mo = new MutationObserver(apply);
        mo.observe(document.documentElement, { attributes: true, subtree: true, attributeFilter: ['content', 'name'] });
      } catch (_e) {}
      setInterval(apply, 1500);
    })();
  </script>
  <style>
    html, body { margin: 0; background: #0a1420; color: #e9e4d6; font-family: Georgia, "Times New Roman", serif; }
    html.bright, html.bright body { background: #efebe3; color: #122238; }
    html.prism, html.prism body { background: #041618; color: #e6fff8; }
    html.astrolabe, html.astrolabe body { background: #0a0c16; color: #f4efe4; }
    #main:empty::before {
      content: "Starting ChEng AIO…";
      display: block;
      padding: 2rem 1.25rem;
      color: var(--muted, #a9a292);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }
    html.bright #main:empty::before { color: #4a5568; }
    html.prism #main:empty::before { color: #7eb8ae; }
    html.astrolabe #main:empty::before { color: #a89a82; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="brand" id="brandHome" role="button" tabindex="0" title="Back to Home" aria-label="Back to Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>ChEng AIO</strong>
          <span>Marine Engineer Suite</span>
        </div>
      </div>
      <div class="vessel-switcher" id="vesselSwitcher">
        <label for="activeVessel">Active vessel</label>
        <select id="activeVessel" aria-label="Active vessel"></select>
      </div>
      <div class="topbar-meta" id="topbarMeta">
        <span id="healthDot" class="health-dot" title="Server"></span>
        <button type="button" class="icon-btn nav-fab" id="navFab" aria-label="Open menu" aria-expanded="false" title="Menu" hidden>☰</button>
        <div class="topbar-id">
          <span class="registered" id="headerRegistered"></span>
          <span class="ver" id="headerVersion"></span>
        </div>
        <button type="button" class="theme-toggle theme-topbar" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>
      </div>
    </header>
    <div class="body">
      <aside class="sidebar" id="sidebar">
        <nav class="nav" id="mainNav">
          <button type="button" class="nav-item active" data-module="home">Home</button>
          <button type="button" class="nav-item" data-module="voyage">Voyage</button>
          <button type="button" class="nav-item" data-module="tanks">Tanks</button>
          <button type="button" class="nav-item" data-module="bunkerplan">Consumption Plan</button>
          <button type="button" class="nav-item" data-module="bunkeringplan">Bunkering Plan</button>
          <button type="button" class="nav-item" data-module="eorb">e-ORB</button>
          <button type="button" class="nav-item" data-module="performance">Performance</button>
          <button type="button" class="nav-item" data-module="vessel">Vessel Setup</button>
          <button type="button" class="nav-item" data-module="backup">Backup</button>
          <button type="button" class="nav-item" data-module="license">License</button>
          <button type="button" class="nav-item" data-module="about">About</button>
        </nav>
        <div class="sidebar-meta" id="sidebarFooter">
          <!-- Day/night sits with the version and the licensed email: three
               things you set once and then read, rather than a control in the
               top bar competing with the vessel switcher. -->
          <button type="button" class="theme-toggle theme-sidebar" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>
          <div class="ver" id="sidebarVersion"></div>
          <div class="registered" id="sidebarRegistered"></div>
          <div class="author" id="sidebarAuthor"></div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary modules">
      <button type="button" class="bottom-item active" data-module="home">Home</button>
      <button type="button" class="bottom-item" data-module="voyage">Voyage</button>
      <button type="button" class="bottom-item" data-module="tanks">Tanks</button>
      <button type="button" class="bottom-item" data-module="eorb">e-ORB</button>
      <button type="button" class="bottom-item" data-module="performance">Perf</button>
    </nav>
    <!-- The AIO's one piece of chrome inside a module. It replaces two floating
         buttons that sat on top of Voyage Chief's and Tank Chief's own header
         rows, and it carries the thing a module cannot tell you: which vessel
         the suite currently has active. -->
    <div class="aio-return-fabs" id="aioReturnFabs" hidden>
      <span class="aio-embed-module" id="aioEmbedModule"></span>
      <span class="aio-embed-vessel" id="aioEmbedVessel" title="Active vessel"></span>
      <button type="button" class="theme-toggle aio-theme-fab" data-theme-toggle aria-pressed="false" title="Day / bright mode for sunlight">Bright</button>
      <button type="button" class="aio-home-fab" id="aioHomeFab" title="Back to Dashboard" aria-label="Back to Dashboard">‹ Dashboard</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/version.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/print-bridge.js"></script>
  <script src="/js/save-file.js"></script>
  <script src="/js/vessel-key.js"></script>
  <script src="/js/camera-capture.js"></script>
  <script src="/js/progress.js"></script>
  <script src="/js/image-cutout.js"></script>
  <script src="/js/signature-pad.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/bridge.js"></script>
  <script src="/js/license-config.js"></script>
  <script src="/js/license.js"></script>
  <script src="/js/voyage-bridge.js"></script>
  <script src="/js/tank-graphics.js"></script>
  <script src="/js/home-dashboard.js"></script>
  <script src="/js/flag-registry.js"></script>
  <script src="/js/perf-calc.js"></script>
  <script src="/js/modules/home.js"></script>
  <script src="/js/modules/vessel.js"></script>
  <script src="/js/modules/backup.js"></script>
  <script src="/js/modules/performance.js"></script>
  <script src="/js/modules/voyage.js"></script>
  <script src="/js/modules/bunkerplan.js"></script>
  <script src="/js/modules/bunkeringplan.js"></script>
  <script src="/js/modules/eorb.js"></script>
  <script src="/js/modules/license.js"></script>
  <script src="/js/modules/about.js"></script>
  <script src="/js/clock-picker.js"></script>
  <script src="/js/shell.js"></script>
  <script>try{ ChengClockPicker && ChengClockPicker.install(); }catch(_e){}</script>
</body>
</html>
